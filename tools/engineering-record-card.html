<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/site-ui.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: #1e1e1e;
      font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
      color: #eee;
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }

    h2 {
      margin: 0 0 20px 0;
      font-weight: 600;
      color: #ccc;
      font-size: 15px;
      letter-spacing: 1px;
    }

    /* ---------- 左侧：预览区 ---------- */
    #left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    #preview-wrapper {
      padding: 30px;
      background: repeating-conic-gradient(#2a2a2a 0% 25%, #333 0% 50%) 50% / 20px 20px;
      border-radius: 12px;
    }

    #preview {
      width: 460px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .header {
      display: flex;
      align-items: center;
      background: #2222cc;
      height: 72px;
      transition: background 0.15s ease;
    }

    .logo-box {
      background: white;
      width: 88px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-box img {
      width: 56px;
      height: 56px;
      object-fit: contain;
    }

    .title {
      color: white;
      font-size: 28px;
      font-weight: bold;
      padding-left: 18px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #cardBody {
      padding: 18px 26px;
      background: rgba(0, 0, 0, 0.5);
      transition: padding 0.15s ease, background 0.15s ease;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      color: white;
      font-size: 22px;
      font-weight: 600;
      gap: 15px;
      overflow: hidden;
      max-height: 48px;
      transition: max-height 0.2s ease, padding 0.2s ease, opacity 0.2s ease;
    }

    .row.hidden-row {
      max-height: 0;
      padding: 0;
      opacity: 0;
    }

    .label {
      white-space: nowrap;
      flex-shrink: 0;
    }

    .value {
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .footer {
      background: #2222cc;
      color: white;
      font-size: 20px;
      font-weight: bold;
      padding: 14px 22px;
      transition: background 0.15s ease;
    }

    /* ---------- 右侧：表单区 ---------- */
    #right-panel {
      flex: 1;
      max-width: 480px;
      height: 100vh;
      overflow-y: auto;
      padding: 30px;
      background: #242424;
      border-left: 1px solid #333;
    }

    #form-panel {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 25px;
    }

    .field-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      align-items: flex-end;
    }

    .field-label {
      flex: 0 0 110px;
    }

    .field-value {
      flex: 1;
    }

    .field-row label {
      display: block;
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
    }

    .field-row input[type=text] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #1b1b1b;
      color: #eee;
      font-size: 13px;
    }

    .field-value input[type=text]::placeholder {
      color: #555;
      font-style: italic;
    }

    .single-field {
      margin-bottom: 14px;
    }

    .single-field label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 5px;
    }

    .single-field input[type=text] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #1b1b1b;
      color: #eee;
      font-size: 14px;
    }

    .section-title {
      font-size: 12px;
      color: #777;
      margin: 20px 0 8px 0;
      padding-top: 10px;
      border-top: 1px solid #3a3a3a;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 10px 0 20px 0;
    }

    .color-row>div {
      flex: 1;
    }

    .color-row label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
    }

    input[type=color] {
      width: 50px;
      height: 36px;
      border: none;
      border-radius: 6px;
      background: none;
      cursor: pointer;
    }

    input[type=range] {
      width: 100%;
    }

    #opacityValue {
      font-size: 13px;
      color: #ccc;
      margin-left: 8px;
    }

    .color-pair {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .color-pair label {
      font-size: 13px;
      color: #aaa;
      flex: 1;
    }

    .reset-btn {
      font-size: 11px;
      color: #888;
      background: #1b1b1b;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
    }

    .reset-btn:hover {
      color: #ccc;
      border-color: #666;
    }

    #downloadBtn {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      background: #2222cc;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    #downloadBtn:hover {
      background: #3333e0;
    }

    .hint {
      font-size: 11px;
      color: #666;
      margin-top: -4px;
      margin-bottom: 12px;
    }

    #right-panel::-webkit-scrollbar {
      width: 8px;
    }

    #right-panel::-webkit-scrollbar-track {
      background: #1e1e1e;
    }

    #right-panel::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }

    #right-panel::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
  </style>
</head>

  <script>
    // 标题 & Contractor 文字绑定
    document.getElementById('titleInput').addEventListener('input', e => {
      document.getElementById('previewTitle').textContent = e.target.value;
    });
    document.getElementById('contractorInput').addEventListener('input', e => {
      document.getElementById('previewFooter').textContent = e.target.value;
    });

    // 内容行绑定
    document.querySelectorAll('.field-row').forEach(fieldRow => {
      const rowNum = fieldRow.getAttribute('data-row');
      const labelInput = fieldRow.querySelector('.labelInput');
      const valueInput = fieldRow.querySelector('.valueInput');
      const previewLabel = document.getElementById('previewLabel' + rowNum);
      const previewValue = document.getElementById('previewValue' + rowNum);
      const previewRow = document.getElementById('row' + rowNum);

      function syncLabel() { previewLabel.textContent = labelInput.value; }
      function syncValue() {
        const val = valueInput.value;
        previewValue.textContent = val;
        previewRow.classList.toggle('hidden-row', val.trim() === '');
      }
      labelInput.addEventListener('input', syncLabel);
      valueInput.addEventListener('input', syncValue);
      syncLabel();
      syncValue();
    });

    // 顶部标题栏颜色
    const DEFAULT_HEADER = '#2222cc';
    const DEFAULT_FOOTER = '#2222cc';
    const DEFAULT_BG = '#000000';

    const headerColorInput = document.getElementById('headerColor');
    const footerColorInput = document.getElementById('footerColor');
    const bgColorInput = document.getElementById('bgColor');
    const bgOpacityInput = document.getElementById('bgOpacity');

    function updateHeaderColor() {
      document.getElementById('previewHeader').style.backgroundColor = headerColorInput.value;
    }
    function updateFooterColor() {
      document.getElementById('previewFooter').style.backgroundColor = footerColorInput.value;
    }
    function hexToRgb(hex) {
      const r = parseInt(hex.substr(1, 2), 16);
      const g = parseInt(hex.substr(3, 2), 16);
      const b = parseInt(hex.substr(5, 2), 16);
      return [r, g, b];
    }
    function updateBg() {
      const hex = bgColorInput.value;
      const opacity = bgOpacityInput.value / 100;
      const [r, g, b] = hexToRgb(hex);
      document.getElementById('cardBody').style.backgroundColor = `rgba(${r},${g},${b},${opacity})`;
      document.getElementById('opacityValue').textContent = Math.round(opacity * 100) + '%';
    }

    headerColorInput.addEventListener('input', updateHeaderColor);
    footerColorInput.addEventListener('input', updateFooterColor);
    bgColorInput.addEventListener('input', updateBg);
    bgOpacityInput.addEventListener('input', updateBg);

    document.getElementById('resetHeaderColor').addEventListener('click', () => {
      headerColorInput.value = DEFAULT_HEADER;
      updateHeaderColor();
    });
    document.getElementById('resetFooterColor').addEventListener('click', () => {
      footerColorInput.value = DEFAULT_FOOTER;
      updateFooterColor();
    });
    document.getElementById('resetBgColor').addEventListener('click', () => {
      bgColorInput.value = DEFAULT_BG;
      updateBg();
    });

    updateHeaderColor();
    updateFooterColor();
    updateBg();

    // 圆角蒙版工具函数
    function roundRectPath(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const target = document.getElementById('preview');
      html2canvas(target, { backgroundColor: null, scale: 2 }).then(canvas => {
        try {
          const outCanvas = document.createElement('canvas');
          outCanvas.width = canvas.width;
          outCanvas.height = canvas.height;
          const ctx = outCanvas.getContext('2d');
          const radius = 16 * 2;
          roundRectPath(ctx, 0, 0, canvas.width, canvas.height, radius);
          ctx.clip();
          ctx.drawImage(canvas, 0, 0);

          const link = document.createElement('a');
          link.download = 'engineering-record.png';
          link.href = outCanvas.toDataURL('image/png');
          link.click();
        } catch (e) {
          alert('下载失败：' + e.message);
        }
      }).catch(e => {
        alert('截图生成失败：' + e.message);
      });
    });
  </script>
</body>
